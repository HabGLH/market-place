services:
  - type: web
    name: market-place-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: ACCESS_TOKEN_LIFE
        value: 15m
      - key: MONGO_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: SHIPPING_FEE_ETB
        value: "100"
      - key: FREE_SHIPPING_THRESHOLD_ETB
        value: "5000"
